<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; /* Mobile browser viewport fix */
            padding: 16px;
        }

        .contact-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            padding: 32px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .contact-card h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .contact-card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .platform-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .platform-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease-in-out;
        }

        /* Hover & Touch effect for mobile/desktop */
        .platform-item:hover, 
        .platform-item:active {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .platform-item span {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .platform-item i {
            font-size: 18px;
        }

        .whatsapp { background: #25D366; }
        .messenger { background: #0084FF; }
        .phone { background: #2b5c8f; }
        .email { background: #ea4335; }

        /* --- Responsive Styles for Desktop & Extra Small Screens --- */
        
        /* Desktop & Larger Screens */
        @media (min-width: 640px) {
            .contact-card {
                padding: 40px 28px;
                border-radius: 24px;
            }
            .contact-card h1 {
                font-size: 28px;
            }
            .contact-card p {
                font-size: 15px;
            }
            .platform-item {
                padding: 16px 20px;
                font-size: 16px;
            }
        }

        /* Extra Small Mobile Devices (width <= 360px) */
        @media (max-width: 360px) {
            .contact-card {
                padding: 24px 16px;
            }
            .contact-card h1 {
                font-size: 22px;
            }
            .platform-item {
                font-size: 14px;
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <div class="status-badge">
            <i class="fas fa-circle" style="font-size: 8px;"></i>
            Available for Assistance
        </div>

        <h1>Get in Touch</h1>
        <p>Choose your preferred channel below to connect with us instantly.</p>

        <div class="platform-list">
            <!-- WhatsApp Button (Fixed Syntax) -->
            <a href="https://wa.me/61415775163" target="_blank" class="platform-item whatsapp">
                <span><i class="fab fa-whatsapp"></i> WhatsApp</span>
                <i class="fas fa-arrow-right"></i>
            </a>

            <!-- Messenger Button -->
            <a href="https://m.me/yourusername" target="_blank" class="platform-item messenger">
                <span><i class="fab fa-facebook-messenger"></i> Messenger</span>
                <i class="fas fa-arrow-right"></i>
            </a>

            <!-- Direct Phone Call -->
            <a href="tel:+61 415 775 163" class="platform-item phone">
                <span><i class="fas fa-phone-alt"></i> Direct Call</span>
                <i class="fas fa-arrow-right"></i>
            </a>

            <!-- Send Email -->
            <a href="mailto:support@example.com" class="platform-item email">
                <span><i class="fas fa-envelope"></i> Send Email</span>
                <i class="fas fa-arrow-right"></i>
            </a>
        </div>
    </div>

</body>
</html>
